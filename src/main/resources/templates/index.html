
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 80px 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
        }

        h1 { color: #1e3a8a; }
        p { color: #475569; }

        .button {
            display: inline-block;
            padding: 12px 22px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            background: #1e40af;
            color: white;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .logout-button { background: #dc2626; }
        .button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TrustVault</h1>
        <h2>Secure Document Management</h2>

        <p>Welcome to TrustVault!</p>

        <p>
            <a class="button" th:href="@{/documents}">
                Open My Documents
            </a>
        </p>

        <p>
            Your documents deserve secure storage
            and controlled access.
        </p>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button class="button logout-button" type="submit">
                Logout
            </button>
        </form>
    </div>
</body>
</html>
