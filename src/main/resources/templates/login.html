
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8eefc, #d9e8f5);
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            color: #173b70;
        }

        .subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: #667085;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #8ab4f8;
            border-color: #2459a9;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2459a9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #173b70;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            background: #fff1f0;
            color: #b42318;
            font-size: 14px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2459a9;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>TrustVault</h1>
        <p class="subtitle">Secure Document Management</p>

        <p class="message" th:if="${param.error}">
            Invalid username or password.
        </p>

        <p class="message"
           th:if="${param.logout}"
           style="background: #ecfdf3; color: #027a48;">
            You have signed out successfully.
        </p>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <button type="submit">Sign In</button>
        </form>

        <a class="back-link" href="/">Back to Home</a>
    </div>
</body>
</html>
